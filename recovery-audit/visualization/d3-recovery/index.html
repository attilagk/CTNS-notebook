<!doctype html><meta charset="utf-8"><style>body{margin:0;background:white}svg{font-family:Arial}</style><svg width="1920" height="1080"></svg><script src="node_modules/d3/dist/d3.min.js"></script><script>
(async()=>{const data=await d3.json('data.json'),svg=d3.select('svg'),axis=540,x=d3.scaleUtc().domain([new Date('2023-09-01Z'),new Date('2025-01-01Z')]).range([240,1800]),N=data.nodes.map(n=>({...n})),map=new Map(N.map(n=>[n.id,n])),E=data.edges.map(e=>({...e,source:map.get(e.source),target:map.get(e.target)}));
N.forEach((n,i)=>{if(n.kind==='notebook'){n.fx=x(new Date(n.date+'Z'));n.fy=axis}else{n.x=300+i*23%1400;n.y=n.row==='top'?260:820}});
const sim=d3.forceSimulation(N).stop().randomSource(d3.randomLcg(.42)).force('link',d3.forceLink(E).id(n=>n.id).distance(160).strength(.12)).force('charge',d3.forceManyBody().strength(-190)).force('collide',d3.forceCollide(13)).force('y',d3.forceY(n=>n.row==='top'?260:n.row==='bottom'?820:axis).strength(.15));for(let k=0;k<900;k++){sim.tick();N.forEach(n=>{if(n.kind==='file'){n.x=Math.max(250,Math.min(1790,n.x));n.y=n.row==='top'?Math.max(170,Math.min(420,n.y)):Math.max(660,Math.min(930,n.y))}})}
svg.append('line').attr('x1',240).attr('x2',1800).attr('y1',axis).attr('y2',axis).attr('stroke','#aaa').attr('stroke-width',7);
for(const date of ['2023-09-01','2024-01-01','2024-03-01','2024-09-01','2025-01-01']){let xx=x(new Date(date+'Z'));svg.append('line').attr('x1',xx).attr('x2',xx).attr('y1',530).attr('y2',550).attr('stroke','#aaa').attr('stroke-width',5);if(date.endsWith('01-01')||date==='2023-09-01')svg.append('text').attr('x',xx).attr('y',590).attr('text-anchor','middle').attr('font-size',28).text(date==='2023-09-01'?'Sep 2023':date.slice(0,4))}
[['inputs',260],['notebooks',540],['outputs',820]].forEach(([t,y])=>svg.append('text').attr('x',35).attr('y',y).attr('dominant-baseline','middle').attr('font-size',29).text(t));
svg.append('text').attr('x',1020).attr('y',55).attr('text-anchor','middle').attr('font-size',48).text('Data recovery and research reproduction');let announcement=svg.append('text').attr('x',240).attr('y',110).attr('text-anchor','start').attr('font-size',34);
const markers=svg.append('defs').selectAll('marker').data(E).join('marker').attr('id',(e,i)=>`arrow-${i}`).attr('viewBox','0 -3 8 6').attr('refX',8).attr('refY',0).attr('markerWidth',8).attr('markerHeight',6).attr('markerUnits','userSpaceOnUse').attr('orient','auto');const arrowheads=markers.append('path').attr('d','M0,-3L8,0L0,3Z');
const endpoint=(e,target)=>{const dx=e.target.x-e.source.x,dy=e.target.y-e.source.y,length=Math.hypot(dx,dy),offset=Math.min(9,length/2);return target?{x:e.target.x-dx/length*offset,y:e.target.y-dy/length*offset}:{x:e.source.x+dx/length*offset,y:e.source.y+dy/length*offset}};
let lines=svg.append('g').selectAll('line').data(E).join('line').attr('x1',e=>endpoint(e,false).x).attr('y1',e=>endpoint(e,false).y).attr('x2',e=>endpoint(e,true).x).attr('y2',e=>endpoint(e,true).y).attr('stroke-width',1.5).attr('marker-end',(e,i)=>`url(#arrow-${i})`);const start=.5,interval=.7,pulseDuration=.7,haloAt=new Map;data.events.forEach((ev,i)=>ev.nodes.forEach(id=>haloAt.set(id,start+i*interval)));let halos=svg.append('g').selectAll('circle').data(N).join('circle').attr('cx',n=>n.x).attr('cy',n=>n.y).attr('r',11.25).attr('fill','#ffd400').attr('opacity',0);let circles=svg.append('g').selectAll('circle').data(N).join('circle').attr('cx',n=>n.x).attr('cy',n=>n.y).attr('r',8).attr('fill','white').attr('stroke-width',2);
const legend=[{x:200,color:'#cf3030',fill:'white',label:'missing'},{x:500,color:'#16844a',fill:'white',label:'recovered'},{x:810,color:'#16844a',fill:'#16844a',label:'reproduced'},{x:1130,color:'#777',fill:'white',label:'initially present'},{x:1540,color:'#bb8100',fill:'white',label:'unknown'}];const lg=svg.append('g');legend.forEach(d=>{lg.append('circle').attr('cx',d.x).attr('cy',1000).attr('r',8).attr('fill',d.fill).attr('stroke',d.color).attr('stroke-width',2);lg.append('text').attr('x',d.x+18).attr('y',1000).attr('dominant-baseline','middle').attr('font-size',23).text(d.label)});
window.renderAt=t=>{const duration=pulseDuration;let amounts=new Map;for(let i=0;i<data.events.length;i++){const at=start+i*interval;if(t>=at)data.events[i].nodes.forEach(id=>amounts.set(id,Math.min(1,(t-at)/duration)))}const color=n=>{let base=n.initial==='present'?'#777':n.initial==='unknown'?'#bb8100':'#cf3030';return amounts.has(n.id)?d3.interpolateRgb(base,'#16844a')(amounts.get(n.id)):base};halos.attr('r',n=>{const age=t-(haloAt.get(n.id)??-Infinity);return age>=0&&age<duration?11.25+16.75*age/duration:11.25}).attr('opacity',n=>{const age=t-(haloAt.get(n.id)??-Infinity);return age>=0&&age<duration?1-age/duration:0});circles.attr('stroke',color).attr('fill',n=>n.kind==='notebook'&&amounts.has(n.id)?d3.interpolateRgb('white','#16844a')(amounts.get(n.id)):'white');lines.attr('stroke',e=>color(e.source));arrowheads.attr('fill',e=>color(e.source));let i=Math.floor((t-start)/interval),phase=(t-start)%interval,ev=i>=0&&i<data.events.length?data.events[i]:null;announcement.text(ev?`Step ${i+1}: ${ev.kind}`:'').attr('opacity',phase<.08?phase/.08:phase>.62?Math.max(0,(interval-phase)/.08):1)};window.renderAt(0);window.layout=N.map(({id,x,y})=>({id,x,y}));window.duration=data.duration;window.ready=true;})();</script>
